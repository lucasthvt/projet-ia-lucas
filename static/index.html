<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TriSupport IA</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <h1>TriSupport IA</h1>
    <p class="subtitle">Tri automatique des demandes de support informatique de l'Atelier Numérique du Pilat.</p>

    <label for="code">Code d'accès</label>
    <input id="code" type="password" autocomplete="off" placeholder="Votre code d'accès">

    <label for="texte">Votre demande</label>
    <textarea id="texte" rows="6" maxlength="2000" placeholder="Collez ici le message à trier…"></textarea>

    <button id="envoyer">Envoyer</button>
    <div id="sortie" aria-live="polite"></div>
    <p class="meta" id="meta"></p>
  </main>

<script>
const $ = (id) => document.getElementById(id);
$("envoyer").addEventListener("click", async () => {
  $("envoyer").disabled = true;
  $("sortie").textContent = "Le modèle réfléchit…";
  $("meta").textContent = "";
  try {
    const r = await fetch("/api/demander", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code: $("code").value, texte: $("texte").value }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || r.status);
    $("sortie").textContent = d.reponse;
    $("meta").textContent = `${d.modele} · ${d.duree_s} s`;
  } catch (e) {
    $("sortie").textContent = "Erreur : " + e.message;
  } finally {
    $("envoyer").disabled = false;
  }
});
</script>
</body>
</html>
